
spring.application.name=CodeVerse
spring.config.import=optional:classpath:application-local.properties

#server
server.port=9797
server.servlet.session.timeout=45m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set this to true only when running HTTPS.
server.servlet.session.cookie.secure=false

# Avoid random login/session loss during local development due to classpath restart.
spring.devtools.restart.enabled=false

#jsp 
spring.mvc.view.suffix=.jsp
spring.mvc.view.prefix=/WEB-INF/views/

#database
spring.datasource.url=jdbc:mysql://localhost:3306/codeversse
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}



#hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#mail configuration - gmail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=niharpatel.270704@gmail.com
spring.mail.password=${MAIL_PASSWORD:}
app.base-url=http://localhost:9797

# Razorpay payment gateway settings.
# Store real values in environment variables or the ignored application-local.properties file.
payment.razorpay.key-id=${RAZORPAY_KEY_ID:}
payment.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
payment.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
payment.razorpay.currency=INR
payment.razorpay.base-url=https://api.razorpay.com/v1
payment.razorpay.checkout-script-url=https://checkout.razorpay.com/v1/checkout.js

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

#max request data count 
server.tomcat.max-part-count=30
# Maximum size for a single file (e.g., 10MB)
spring.servlet.multipart.max-file-size=10MB
# Maximum size for the entire request (e.g., 12MB)
spring.servlet.multipart.max-request-size=12MB

#cloudinary
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# demo seeding (set true only when you want to generate demo users and hackathons)
app.seed-demo-data=false